name: CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - name: Install dependencies
        # --ignore-scripts because a pull request supplies its own package.json, and a lifecycle
        # hook would run before the suite a reviewer is actually reading. Nothing here needs one:
        # the Playwright browsers are installed by the explicit step below.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # Chromium only in this job. WebKit is downloaded by the browser-parity job below, which
        # is the whole point of the split: this gate no longer waits for a 100MB browser it does
        # not run.
        run: npx playwright install --with-deps chromium

      # Its own step, and only here. `quality` used to begin with this, which put it in the deploy
      # job too - the job that goes on to build and upload the Pages artifact that is then attested.
      # `nexus-agents` is 209 of the 421 packages in the lockfile against a production runtime tree
      # of 14, and `verify` executes that tree: core modules, native bindings, a write to
      # ~/.nexus-agents, and three authenticated adapter probes. `npm ci --ignore-scripts` stops
      # install-time execution and does nothing about runtime execution. The attestation would still
      # be true and would still cover a job in which all of that ran.
      #
      # It stays a gate, because it is deterministic and it is what catches a broken agent
      # installation or configuration. It just no longer runs anywhere near the deployed bytes.
      - name: Agent tooling configuration gate
        run: npm run agents:verify

      - name: Quality gate
        run: npm run quality

      # Kept only when something failed, because that is the only time it is worth anything.
      #
      # The reporter is `list`, so a green run produces no artefact and a red one produces the
      # assertion text in the log and nothing else. That is enough for a failure anybody can
      # reproduce and not enough for one nobody can: the narrow-text layout sweep has now gone red
      # twice without a diagnosis surviving, once here and once locally, because Playwright clears
      # `test-results/` at the start of the next run and the next run was green.
      #
      # A trace carries the DOM snapshot at the moment of the assertion, which for a layout failure
      # is the whole question — which element was starved, and what was around it. Fourteen days is
      # long enough to look at a red build and short enough not to accumulate.
      - name: Keep the failing run's evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence-${{ github.job }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # WebKit, on its own runner and off the critical path.
  #
  # It is not optional and it is not slower by accident. Measured against the same suite, chromium
  # sums 320s of test time against webkit's 1213s - roughly 4x, with a per-test median of 3.4x and
  # no hot spot anywhere. That profile is uniform driver and engine cost, so there is nothing to
  # optimise: no single test, fixture or helper whose repair moves the number. Both leads this
  # issue proposed were measured and refuted - serving a production build cannot work while the
  # suite makes 30 runtime `import('/src/...')` calls, and the axe scans cost the same 4.2x as the
  # tests that run no scan at all.
  #
  # So the cost is real, permanent, and worth paying. WebKit is what caught unstyled controls
  # inheriting the platform button face at 1.81:1, and tooltips accumulating because it does not
  # focus a button on tap. Neither was visible to Chromium.
  #
  # Splitting it changes no coverage. It only stops every other check waiting behind it.
  browser-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: WebKit browser suite
        run: npm run test:e2e:webkit

      # Kept only when something failed, because that is the only time it is worth anything.
      #
      # The reporter is `list`, so a green run produces no artefact and a red one produces the
      # assertion text in the log and nothing else. That is enough for a failure anybody can
      # reproduce and not enough for one nobody can: the narrow-text layout sweep has now gone red
      # twice without a diagnosis surviving, once here and once locally, because Playwright clears
      # `test-results/` at the start of the next run and the next run was green.
      #
      # A trace carries the DOM snapshot at the moment of the assertion, which for a layout failure
      # is the whole question — which element was starved, and what was around it. Fourteen days is
      # long enough to look at a red build and short enough not to accumulate.
      - name: Keep the failing run's evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence-${{ github.job }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # The single required status check, and deliberately a job that does no work.
  #
  # Branch protection requires one context by name, `quality`. When the WebKit suite moved onto its
  # own runner, that name stopped covering it — a pull request could go green and merge with WebKit
  # failing, which was impossible while both ran in one job. Splitting the work quietly narrowed
  # what the gate was asserting.
  #
  # Rather than widen the protection rule to name every job, which then has to be edited by hand
  # each time a job is added or renamed, this job fans in. It fails if either half fails, so the
  # rule keeps meaning "everything passed" without knowing what everything is.
  quality:
    runs-on: ubuntu-latest
    needs: [checks, browser-parity, dependency-review]
    # always(), and the results are read explicitly, because `needs` alone is not enough here. A
    # job whose dependency fails is *skipped*, not failed, and a skipped required check is not
    # reliably treated as blocking — the behaviour differs by how the skip arose and is not
    # something a merge gate should rest on. Running unconditionally and asserting each result
    # turns an ambiguity into a definite red.
    if: always()
    steps:
      - name: Confirm every suite passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER_PARITY: ${{ needs.browser-parity.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          echo "checks=$CHECKS browser-parity=$BROWSER_PARITY dependency-review=$DEPENDENCY_REVIEW"
          for result in "$CHECKS" "$BROWSER_PARITY"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required suite did not succeed."
              exit 1
            fi
          done
          # dependency-review is pull_request-only, so on a push to main it is skipped rather than
          # run. Skipped is allowed; failed is not. Treating skipped as a failure would make every
          # push to main red, and treating failure as acceptable is how it sat outside the gate.
          if [ "$DEPENDENCY_REVIEW" != "success" ] && [ "$DEPENDENCY_REVIEW" != "skipped" ]; then
            echo "::error::dependency-review did not succeed."
            exit 1
          fi

  # Blocks a pull request that introduces a dependency with a known advisory, before it is
  # merged and before `npm audit` would catch it on main. Pull-request event only: it compares
  # the base and head manifests, so it has nothing to compare on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Matches the threshold `npm run audit` enforces, so the two gates cannot disagree
          # about what is acceptable.
          fail-on-severity: moderate
          # No comment-summary-in-pr. Posting one needs `pull-requests: write`, this job has
          # `contents: read`, and the summary silently never appeared — protection that reads as
          # working is worse than none. Granting the scope was the other option and is a poor
          # trade: it would widen a token on a job that processes untrusted pull-request content,
          # to buy a comment that fork PRs can never receive anyway, since GitHub caps their token
          # read-only regardless. The failing check is the protection; the run log carries the
          # detail.
