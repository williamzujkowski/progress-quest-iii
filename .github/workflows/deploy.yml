name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - name: Install dependencies
        # --ignore-scripts because a pull request supplies its own package.json, and a lifecycle
        # hook would run before the suite a reviewer is actually reading. Nothing here needs one:
        # the Playwright browsers are installed by the explicit step below.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # Both engines the suite runs against. WebKit earns its download: running it found
        # unstyled controls inheriting the platform button face at 1.81:1, and tooltips that
        # accumulated because it does not focus a button on tap - neither visible to Chromium.
        run: npx playwright install --with-deps chromium webkit

      - name: Quality gate
        run: npm run quality

      # Records what the deployed bundle was actually built from. Written outside dist/ on
      # purpose: anything inside it would be published and would land in the service worker's
      # precache list.
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'
          include-hidden-files: false

  # Provenance for the exact bytes that get published, in a job of its own so the build stays
  # read-only. Attestation needs write scopes; granting them to the job that runs the build and
  # the test suite would undo the separation the build/deploy split exists to create.
  #
  # Deploy does not wait on this. A provenance failure should be visible without also being able
  # to withhold a release - the attestation describes an artifact that was already built, and
  # blocking on it would make a signing outage an outage of the site.
  attest:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: pages-artifact

      - name: Attest the deployed artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pages-artifact/artifact.tar

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
